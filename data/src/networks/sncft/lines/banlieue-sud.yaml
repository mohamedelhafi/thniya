    direction: NORD
    main: true
    stops:
      - TRN-ERRIADH
      - TRN-BORJCEDRIA
      - TRN-BIRELBEY
      - TRN-HAMMAMCHATT
      - TRN-TAHARSFAR
      - TRN-STADE
      - TRN-HAMMAMLIF
      - TRN-BOUKORNINE
      - TRN-LYCEEEZZAHRA
      - TRN-EZZAHRA
      - TRN-RADESMELIANE
      - TRN-RADES
      - TRN-LYCEERADES
      - TRN-SIDIREZIG
      - TRN-MEGRINE
      - TRN-MEGRINERIADH
      - TRN-JEBELJELLOUD
      - TRN-TUNISVILLE
    shape: auto
  - id: OMNIBUS-SUD
    direction: SUD
    main: true
    stops:
      - TRN-TUNISVILLE
      - TRN-JEBELJELLOUD
      - TRN-MEGRINERIADH
      - TRN-MEGRINE
      - TRN-SIDIREZIG
      - TRN-LYCEERADES
      - TRN-RADES
      - TRN-RADESMELIANE
      - TRN-EZZAHRA
      - TRN-LYCEEEZZAHRA
      - TRN-BOUKORNINE
