# yaml-language-server: $schema=../../../schemas/calendar-year.schema.json
# Événements 2026 (specs/04b §3). Fêtes religieuses : dates mobiles, à confirmer.
year: 2026
events:
  # --- Fêtes civiles
  - { id: NOUVEL_AN,     kind: holiday, date: 2026-01-01, status: confirmed, name: { fr: "Jour de l'an", ar: "رأس السنة الإدارية" } }
  - { id: INDEPENDANCE,  kind: holiday, date: 2026-03-20, status: confirmed, name: { fr: "Fête de l'indépendance", ar: "عيد الاستقلال" } }
  - { id: MARTYRS,       kind: holiday, date: 2026-04-09, status: confirmed, name: { fr: "Journée des martyrs", ar: "عيد الشهداء" } }
  - { id: TRAVAIL,       kind: holiday, date: 2026-05-01, status: confirmed, name: { fr: "Fête du travail", ar: "عيد الشغل" } }
  - { id: REPUBLIQUE,    kind: holiday, date: 2026-07-25, status: confirmed, name: { fr: "Fête de la République", ar: "عيد الجمهورية" } }
  - { id: FEMME,         kind: holiday, date: 2026-08-13, status: confirmed, name: { fr: "Fête de la femme", ar: "عيد المرأة" } }
  - { id: EVACUATION,    kind: holiday, date: 2026-10-15, status: confirmed, name: { fr: "Fête de l'évacuation", ar: "عيد الجلاء" } }
