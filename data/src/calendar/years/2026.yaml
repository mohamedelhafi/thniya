  - { id: AID_ADHA,      kind: holiday, from: 2026-05-27, to: 2026-05-28, status: estimated, name: { fr: "Aïd el-Adha", ar: "عيد الأضحى" } }
  - { id: HIJRI,         kind: holiday, date: 2026-06-16, status: estimated, name: { fr: "Ras el Am el Hijri", ar: "رأس السنة الهجرية" } }
  - { id: MOULED,        kind: holiday, date: 2026-08-25, status: confirmed, name: { fr: "Mouled", ar: "المولد النبوي" } }

  # --- Saisons
  - id: ETE
    kind: period_event
    from: 2026-07-01
    to: 2026-08-31
    status: confirmed
    name: { fr: "Horaires d'été", ar: "التوقيت الصيفي" }
    source: "SNCFT, horaires de la banlieue 1er juillet – 31 août 2026 (La Presse, 29/06/2026)"
