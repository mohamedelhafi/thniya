# Port 80 : santé + redirection vers HTTPS (sur le VPS, aussi le challenge Let's Encrypt)
server {
    listen 8080;
    server_name _;

    location = /healthz { return 200 "ok\n"; }
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    include /etc/nginx/conf.d/hsts.inc;   # vide en local, HSTS en production

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header X-Request-Id $req_id always;
    add_header X-Cache $upstream_cache_status always;   # HIT / MISS / STALE… (vide hors API)

    limit_conn conn 20;

    location = /healthz { return 200 "ok\n"; }

    # Actuator jamais exposé
    location /api/actuator { return 403; }
    location /actuator     { return 403; }

    location = /api/v1/itineraries {
        limit_req zone=itin burst=10 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location ~ ^/api/v1/itineraries/ {
        limit_req zone=itin burst=10 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location ~ ^/api/v1/(geocode|reverse) {
        limit_req zone=geo burst=15 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
        include /etc/nginx/conf.d/api-cache.inc;
    }
    location = /api/v1/feedback {
        limit_req zone=fb burst=5 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
        include /etc/nginx/conf.d/api-cache.inc;
    }

    # Fond de carte : fichiers .pmtiles servis en statique (requêtes Range), cache long
    location /tiles/ {
        limit_req zone=tiles burst=200 nodelay;
        alias /srv/tiles/;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
        types { application/vnd.pmtiles pmtiles; application/json json; }
    }

    error_page 429 = @too_many;
    location @too_many {
        default_type application/problem+json;
        return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"code":"RATE_LIMITED"}';
    }

    location / { return 404; }
}
