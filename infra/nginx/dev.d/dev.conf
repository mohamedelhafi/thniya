# Développement uniquement (monté par compose.local.yml, lié à 127.0.0.1) :
# sert l'app web Flutter, l'API et les tuiles depuis la même origine, en HTTP.
server {
    listen 8090;
    server_name _;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Cache $upstream_cache_status always;

    location /api/actuator { return 403; }
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
        include /etc/nginx/conf.d/api-cache.inc;
    }
    location /tiles/ {
        alias /srv/tiles/;
        types { application/vnd.pmtiles pmtiles; }
        add_header Access-Control-Allow-Origin "*" always;
    }
    location / {
        root /srv/web;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
