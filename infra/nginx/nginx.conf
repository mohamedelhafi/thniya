# Passerelle Thniya — specs/03-gateway-securite.md
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 30s;
    client_max_body_size 16k;

    # Logs JSON (IP, chemin, statut, temps, identifiant de requête)
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }
    log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                                '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                                '"rt":$request_time,"urt":"$upstream_response_time","req_id":"$req_id",'
                                '"ua":"$http_user_agent"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types application/json application/problem+json text/plain;
    gzip_min_length 512;

    # Limites par IP. Larges au départ : beaucoup d'abonnés mobiles tunisiens partagent une IP (CGNAT).
    limit_req_zone  $binary_remote_addr zone=itin:10m  rate=30r/m;
    limit_req_zone  $binary_remote_addr zone=geo:10m   rate=5r/s;
    limit_req_zone  $binary_remote_addr zone=api:10m   rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=tiles:10m rate=60r/s;
    limit_req_zone  $binary_remote_addr zone=fb:10m    rate=1r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # Cache des réponses GET de l'API (voir conf.d/api-cache.inc)
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=apicache:20m max_size=256m inactive=30m
                     use_temp_path=off;
    # Langue de la réponse, comme Lang.fromHeader côté Spring : partage du cache entre clients de même langue
    map $http_accept_language $lang_key {
        default    $http_accept_language;
        ""         fr;
        ~*^\s*ar   ar;
        ~*^\s*fr   fr;
    }

    upstream api {
        server api:8080;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/dev.d/*.conf;   # vide hors développement
}
